[workspace]
members = ["crates/*"]

[package]
name = "thyllore-animation"
version = "0.0.1-preview"
edition = "2021"
license = "Apache-2.0"
authors = ["kodai731"]
description = "A real-time animation and rendering engine powered by ECS architecture, built in Rust with Vulkan"
repository = "https://github.com/kodai731/Thyllore-Animation"
build = "build.rs"

[[bin]]
name = "thyllore-animation"
path = "src/main.rs"

[[bin]]
name = "thyllore-render-usd"
path = "src/bin/render_usd.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
thyllore-math-core = { path = "crates/thyllore-math-core" }
thyllore-model-core = { path = "crates/thyllore-model-core" }
thyllore-anim-core = { path = "crates/thyllore-anim-core" }
thyllore-ml-core = { path = "crates/thyllore-ml-core", optional = true }
thyllore-importer-core = { path = "crates/thyllore-importer-core" }
thyllore-exporter-core = { path = "crates/thyllore-exporter-core" }
thyllore-render-core = { path = "crates/thyllore-render-core" }
thyllore-vulkan-core = { path = "crates/thyllore-vulkan-core" }
thyllore-grpc-client = { path = "crates/thyllore-grpc-client", optional = true }
anyhow = "1"
log = "0.4"
cgmath = "0.18"
png = "0.17"
env_logger = "0.11"
thiserror = "1"
vulkanalia = { version = "=0.26.0", features = ["libloading", "provisional", "window"] }
copypasta = "0.8"
imgui = { path = "./vendor/imgui", features = ["tables-api", "docking"] }
imgui-winit-support = { path = "./vendor/imgui-winit-support" }
winit = "0.29"
raw-window-handle = "0.6"
chrono = "0.4"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "2"
ufbx = "0.10"
rfd = "0.15"
ron = "0.8"
fbxcel = { version = "0.9", features = ["writer"] }
ort = { version = "2.0.0-rc.11", default-features = false, features = ["std", "ndarray", "load-dynamic", "download-binaries", "copy-dylibs", "tls-native"], optional = true }

[features]
default = ["ml"]
ml = ["dep:ort", "dep:thyllore-ml-core"]
text-to-motion = ["dep:thyllore-grpc-client", "thyllore-grpc-client/text-to-motion"]
auto-rig = ["text-to-motion", "thyllore-grpc-client/auto-rig", "thyllore-importer-core/auto-rig"]

[dependencies.gltf]
version = "1.4"
features = ["extras", "names", "extensions"]
[patch.crates-io]
openusd = { path = "vendor/openusd" }
