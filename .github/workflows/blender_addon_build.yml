name: Blender Addon Build

on:
  push:
    branches: [main, develop]
    paths:
      - 'blender_addon/**'
      - 'crates/thyllore-ml-api/**'
      - 'crates/thyllore-ml-core/**'
      - 'scripts/build_blender_addon.ps1'
      - 'scripts/collect_wheels.ps1'
      - 'scripts/ci_rawfuture_inference_smoke.sh'
      - '.github/workflows/blender_addon_build.yml'
  pull_request:
    paths:
      - 'blender_addon/**'
      - 'crates/thyllore-ml-api/**'
      - 'crates/thyllore-ml-core/**'
      - 'scripts/build_blender_addon.ps1'
      - 'scripts/collect_wheels.ps1'
      - 'scripts/ci_rawfuture_inference_smoke.sh'
      - '.github/workflows/blender_addon_build.yml'

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win_amd64
            os: windows-latest
            wheel_platform: win_amd64
          - platform: linux_x86_64
            os: ubuntu-latest
            wheel_platform: manylinux2014_x86_64
          - platform: macosx_arm64
            os: macos-latest
            wheel_platform: macosx_11_0_arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Python build deps
        run: |
          python -m pip install --upgrade pip
          pip install "cryptography>=42" "maturin>=1.5"

      # Phase 5.5 MVP removes the license module; keypair step kept commented
      # for one-line reactivation when Phase 6 ships the Auth Backend.
      # - name: Generate dev keypair (CI only — not committed)
      #   shell: pwsh
      #   run: |
      #     pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/gen_license_keypair.ps1

      - name: Collect vendored wheels
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/collect_wheels.ps1 `
              -Platforms ${{ matrix.wheel_platform }}

      - name: Build addon ZIP (incl. ABI marker verify)
        id: build
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build_blender_addon.ps1 `
              -Platform ${{ matrix.platform }} `
              -SkipBlenderValidate

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: thyllore_animation_addon-${{ matrix.platform }}
          path: ${{ steps.build.outputs.zip_path }}
          retention-days: 7
          if-no-files-found: error

  rawfuture-smoke:
    name: Rawfuture inference smoke (HF dummy model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Download dummy model + run inference smoke
        run: bash scripts/ci_rawfuture_inference_smoke.sh

  validate:
    name: Validate ZIP via Blender 4.2 LTS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: thyllore_animation_addon-linux_x86_64
          path: dist/

      - name: Install Blender 4.2 LTS
        run: |
          wget -q -O blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          mkdir -p /opt/blender
          tar -xJf blender.tar.xz -C /opt/blender --strip-components=1
          /opt/blender/blender --version

      - name: Validate extension
        run: |
          ZIP=$(ls dist/*.zip | head -n1)
          if [[ -z "$ZIP" ]]; then
              echo "::error::No ZIP found in downloaded artifact" >&2
              exit 1
          fi
          /opt/blender/blender --command extension validate "$ZIP"
