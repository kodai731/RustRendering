name: Blender Addon Release

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "B: full (GitHub Pages deploy) / A: degraded (artifact for extensions.blender.org) / C: Blender Market paid"
        type: choice
        options:
          - B
          - A
          - C
        default: B
      platform:
        description: "Target platform to build"
        type: choice
        options:
          - all
          - win_amd64
          - linux_x86_64
          - macosx_arm64
        default: all
      version:
        description: "Extension version"
        type: string
        default: "0.0.1"
      hf_model_file:
        description: "Production ONNX filename in the private HF repo"
        type: string
        default: "curve_copilot_prod.onnx"

env:
  ORT_VERSION: 1.23.2
  HF_MODEL_REPO: kodai731/thyllore-curve-copilot

permissions:
  contents: read

jobs:
  setup:
    name: Resolve platform matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve platform matrix from input
        id: resolve
        shell: bash
        env:
          SELECTED_PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          platforms = [
              {
                  "platform": "win_amd64",
                  "os": "windows-latest",
                  "wheel_platform": "win_amd64",
                  "ort_archive": "onnxruntime-win-x64",
                  "ort_ext": "zip",
                  "ort_lib": "lib/onnxruntime.dll",
              },
              {
                  "platform": "linux_x86_64",
                  "os": "ubuntu-latest",
                  "wheel_platform": "manylinux2014_x86_64",
                  "ort_archive": "onnxruntime-linux-x64",
                  "ort_ext": "tgz",
                  "ort_lib": "lib/libonnxruntime.so",
              },
              {
                  "platform": "macosx_arm64",
                  "os": "macos-latest",
                  "wheel_platform": "macosx_11_0_arm64",
                  "ort_archive": "onnxruntime-osx-arm64",
                  "ort_ext": "tgz",
                  "ort_lib": "lib/libonnxruntime.dylib",
              },
          ]
          selected = os.environ["SELECTED_PLATFORM"]
          if selected != "all":
              platforms = [e for e in platforms if e["platform"] == selected]
          print("matrix=" + json.dumps({"include": platforms}))
          PY

  build:
    name: Build release ZIP (${{ matrix.platform }} / mode ${{ inputs.build_mode }}, prod)
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      THYLLORE_FEEDBACK_PROD_ENDPOINT: ${{ secrets.THYLLORE_FEEDBACK_PROD_ENDPOINT }}
      THYLLORE_INGEST_TOKEN: ${{ secrets.THYLLORE_INGEST_TOKEN }}
      THYLLORE_LICENSE_ENDPOINT: ${{ secrets.THYLLORE_LICENSE_ENDPOINT }}
      THYLLORE_FULL_TOKEN_PUBKEY_B64: ${{ secrets.THYLLORE_FULL_TOKEN_PUBKEY_B64 }}
    steps:
      - name: Require release secrets (no dummy fallback for distribution builds)
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BUILD_MODE: ${{ inputs.build_mode }}
        run: |
          $required = @('HF_TOKEN')
          if ($env:BUILD_MODE -eq 'B') {
              $required += @(
                  'THYLLORE_FEEDBACK_PROD_ENDPOINT',
                  'THYLLORE_INGEST_TOKEN',
                  'THYLLORE_FULL_TOKEN_PUBKEY_B64'
              )
          } elseif ($env:BUILD_MODE -eq 'C') {
              $required += @(
                  'THYLLORE_LICENSE_ENDPOINT',
                  'THYLLORE_FULL_TOKEN_PUBKEY_B64',
                  'THYLLORE_FEEDBACK_PROD_ENDPOINT',
                  'THYLLORE_INGEST_TOKEN'
              )
          }
          $missing = @($required | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          if ($missing.Count -gt 0) {
              Write-Host "::error::Missing repository secrets required for release: $($missing -join ', ')"
              exit 1
          }

      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Python build deps
        run: |
          python -m pip install --upgrade pip
          pip install "maturin>=1.5"

      - name: Collect vendored wheels
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/collect_wheels.ps1 `
              -Platforms ${{ matrix.wheel_platform }} `
              -Variant lite

      - name: Download ONNX Runtime ${{ env.ORT_VERSION }}
        id: ort
        shell: pwsh
        run: |
          $archive = "${{ matrix.ort_archive }}-$env:ORT_VERSION.${{ matrix.ort_ext }}"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/$archive"
          $dest = Join-Path $env:RUNNER_TEMP $archive
          Invoke-WebRequest -Uri $url -OutFile $dest -MaximumRetryCount 3 -RetryIntervalSec 2
          $extractDir = Join-Path $env:RUNNER_TEMP "ort"
          New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
          if ('${{ matrix.ort_ext }}' -eq 'zip') {
              Expand-Archive -Path $dest -DestinationPath $extractDir -Force
          } else {
              tar -xzf $dest -C $extractDir
          }
          $libPath = Join-Path $extractDir "${{ matrix.ort_archive }}-$env:ORT_VERSION" "${{ matrix.ort_lib }}"
          if (-not (Test-Path $libPath)) { throw "ONNX Runtime lib not found: $libPath" }
          "lib_path=$libPath" >> $env:GITHUB_OUTPUT

      - name: Download production curve_copilot ONNX (private HF)
        id: model
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "curve_copilot.onnx"
          $url = "https://huggingface.co/$env:HF_MODEL_REPO/resolve/main/${{ inputs.hf_model_file }}"
          Invoke-WebRequest -Uri $url -Headers @{ Authorization = "Bearer $env:HF_TOKEN" } `
              -OutFile $dest -MaximumRetryCount 3 -RetryIntervalSec 2
          "path=$dest" >> $env:GITHUB_OUTPUT

      - name: Build release ZIP (prod endpoint, production model)
        id: build
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build_blender_addon.ps1 `
              -Platform ${{ matrix.platform }} `
              -Variant lite `
              -BuildMode ${{ inputs.build_mode }} `
              -EndpointEnv prod `
              -Version '${{ inputs.version }}' `
              -IncludeOnnxModel `
              -OnnxSourcePath '${{ steps.model.outputs.path }}' `
              -OnnxruntimeLib '${{ steps.ort.outputs.lib_path }}' `
              -OutputDir dist/release `
              -SkipBlenderValidate

      - name: Upload release ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-zip-${{ matrix.platform }}
          path: dist/release/*.zip
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Validate ZIPs (+ Pages index for mode B)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all release ZIPs
        uses: actions/download-artifact@v4
        with:
          pattern: release-zip-*
          path: site
          merge-multiple: true

      - name: Install Blender 4.2 LTS
        run: |
          wget -q -O blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          mkdir -p /opt/blender
          tar -xJf blender.tar.xz -C /opt/blender --strip-components=1
          /opt/blender/blender --version

      - name: Validate ZIPs
        run: |
          set -euo pipefail
          for zip in site/*.zip; do
              echo "::group::validate $(basename "$zip")"
              /opt/blender/blender --command extension validate "$zip"
              echo "::endgroup::"
          done

      - name: Generate index.json (mode B)
        if: inputs.build_mode == 'B'
        run: |
          set -euo pipefail
          /opt/blender/blender --command extension server-generate --repo-dir=site --html
          cat site/index.json

      - name: Upload Pages artifact (mode B)
        if: inputs.build_mode == 'B'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    needs: publish
    if: inputs.build_mode == 'B'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
