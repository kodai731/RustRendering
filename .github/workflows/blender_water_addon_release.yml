name: Blender Water Addon Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Extension version (release tag becomes water-v<version>)"
        type: string
        default: "0.0.1"
      build_mode:
        description: "release strips debug tools; debug keeps the debug/ package"
        type: choice
        options:
          - release
          - debug
        default: release
      publish_release:
        description: "Attach the ZIPs to the GitHub Release water-v<version> (created when missing)"
        type: boolean
        default: true
      deploy_pages:
        description: "Publish to the GitHub Pages extension repository (keeps the other extensions already served)"
        type: boolean
        default: true

env:
  PAGES_URL: https://kodai731.github.io/Thyllore-Animation

permissions:
  contents: write

jobs:
  wheels:
    name: Build thyllore_effect_core wheel (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win_amd64
            os: windows-latest
          - platform: linux_x86_64
            os: ubuntu-latest
          - platform: macosx_arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build wheel via maturin
        shell: bash
        run: |
          python -m pip install --upgrade pip "maturin>=1.5"
          cd crates/thyllore-effect-core
          maturin build --release --features python --out "$GITHUB_WORKSPACE/wheels_out"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: water-wheel-${{ matrix.platform }}
          path: wheels_out/*.whl
          retention-days: 7
          if-no-files-found: error

  package:
    name: Package + validate ZIPs (${{ inputs.build_mode }})
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: water-wheel-*
          path: blender_addon/effects/water/wheels
          merge-multiple: true

      - name: Install Blender 4.2 LTS
        run: |
          wget -q -O blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          mkdir -p /opt/blender
          tar -xJf blender.tar.xz -C /opt/blender --strip-components=1
          /opt/blender/blender --version

      - name: Build ZIP per platform
        run: |
          set -euo pipefail
          for platform in win_amd64 linux_x86_64 macosx_arm64; do
              bash scripts/blender/water/build_addon.sh \
                  --platform "$platform" \
                  --build-mode "${{ inputs.build_mode }}" \
                  --version "${{ inputs.version }}" \
                  --output-dir dist/water \
                  --skip-validate
          done
          ls -l dist/water

      - name: Validate ZIPs
        run: |
          set -euo pipefail
          for zip in dist/water/*.zip; do
              echo "::group::validate $(basename "$zip")"
              /opt/blender/blender --command extension validate "$zip"
              echo "::endgroup::"
          done

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thyllore_water-${{ inputs.build_mode }}-${{ inputs.version }}
          path: dist/water/*.zip
          retention-days: 7
          if-no-files-found: error

      - name: Attach ZIPs to GitHub Release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: water-v${{ inputs.version }}
          name: Thyllore Water ${{ inputs.version }}
          prerelease: true
          files: dist/water/*.zip

  pages:
    name: Extension repository (GitHub Pages)
    needs: package
    if: inputs.deploy_pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download water ZIPs
        uses: actions/download-artifact@v4
        with:
          name: thyllore_water-${{ inputs.build_mode }}-${{ inputs.version }}
          path: site

      - name: Keep the other extensions already served
        run: python3 scripts/blender/merge_live_extensions.py --site site --url "$PAGES_URL" --exclude-id thyllore_water

      - name: Install Blender 4.2 LTS
        run: |
          wget -q -O blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          mkdir -p /opt/blender
          tar -xJf blender.tar.xz -C /opt/blender --strip-components=1

      - name: Generate index.json
        run: |
          /opt/blender/blender --command extension server-generate --repo-dir=site --html
          cat site/index.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
