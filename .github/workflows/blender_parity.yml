name: Blender Parity

on:
  push:
    branches: [main, develop]
    paths:
      - 'crates/thyllore-ml-core/**'
      - 'crates/thyllore-ml-api/**'
      - 'crates/thyllore-grpc-client/**'
      - 'blender_addon/**'
      - 'proto/**'
      - 'scripts/build_blender_addon.ps1'
      - 'scripts/generate_parity_fixtures.sh'
      - 'scripts/generate_parity_fixtures.ps1'
      - '.github/workflows/blender_parity.yml'
  pull_request:
    paths:
      - 'crates/thyllore-ml-core/**'
      - 'crates/thyllore-ml-api/**'
      - 'crates/thyllore-grpc-client/**'
      - 'blender_addon/**'
      - 'proto/**'
      - '.github/workflows/blender_parity.yml'
  workflow_dispatch:

env:
  BLENDER_VERSION: "4.2.0"
  ONNX_REPO: "kodai731/thyllore-curve-copilot"
  ONNX_REVISION: "904b8b9e4cb7b2bf7c702100253c5868ba5eb2e1"

jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            blender_target: linux-x64
            blender_archive: blender.tar.xz
            blender_url: "https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz"
            blender_extract_cmd: "tar -xf blender.tar.xz"
            blender_exe_relative: "blender-4.2.0-linux-x64/blender"
            extension_platform: "linux_x86_64"
            wheel_platform: "manylinux2014_x86_64"
            ort_archive: onnxruntime-linux-x64-1.23.2.tgz
            ort_url: "https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-linux-x64-1.23.2.tgz"
            ort_extract_cmd: "tar -xzf onnxruntime-linux-x64-1.23.2.tgz"
            ort_dylib_relative: "vendor/onnxruntime/onnxruntime-linux-x64-1.23.2/lib/libonnxruntime.so"
          - os: windows-latest
            blender_target: windows-x64
            blender_archive: blender.zip
            blender_url: "https://download.blender.org/release/Blender4.2/blender-4.2.0-windows-x64.zip"
            blender_extract_cmd: "7z x blender.zip"
            blender_exe_relative: "blender-4.2.0-windows-x64/blender.exe"
            extension_platform: "win_amd64"
            wheel_platform: "win_amd64"
            ort_archive: onnxruntime-win-x64-1.23.2.zip
            ort_url: "https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-win-x64-1.23.2.zip"
            ort_extract_cmd: "7z x onnxruntime-win-x64-1.23.2.zip"
            ort_dylib_relative: "vendor/onnxruntime/onnxruntime-win-x64-1.23.2/lib/onnxruntime.dll"
          - os: macos-14
            blender_target: macos-arm64
            blender_archive: blender.dmg
            blender_url: "https://download.blender.org/release/Blender4.2/blender-4.2.0-macos-arm64.dmg"
            blender_extract_cmd: |
              hdiutil attach blender.dmg -mountpoint /Volumes/BlenderPhase5
              cp -R /Volumes/BlenderPhase5/Blender.app blender.app
              hdiutil detach /Volumes/BlenderPhase5
            blender_exe_relative: "blender.app/Contents/MacOS/Blender"
            extension_platform: "macosx_arm64"
            wheel_platform: "macosx_11_0_arm64"
            ort_archive: onnxruntime-osx-arm64-1.23.2.tgz
            ort_url: "https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-osx-arm64-1.23.2.tgz"
            ort_extract_cmd: "tar -xzf onnxruntime-osx-arm64-1.23.2.tgz"
            ort_dylib_relative: "vendor/onnxruntime/onnxruntime-osx-arm64-1.23.2/lib/libonnxruntime.dylib"
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout ThylloreAnimation
        uses: actions/checkout@v4
        with:
          path: ThylloreAnimation

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ThylloreAnimation/crates/thyllore-ml-core
            ThylloreAnimation/crates/thyllore-grpc-client
            ThylloreAnimation/crates/thyllore-ml-api

      - name: Setup Python (host, for maturin)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Blender 4.2 LTS
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: blender_install
          key: blender-${{ matrix.blender_target }}-${{ env.BLENDER_VERSION }}

      - name: Download and extract Blender 4.2 LTS (cache miss)
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          mkdir -p blender_install
          cd blender_install
          curl -L -o ${{ matrix.blender_archive }} "${{ matrix.blender_url }}"
          ${{ matrix.blender_extract_cmd }}
          rm ${{ matrix.blender_archive }}

      - name: Resolve Blender executable path
        id: blender-path
        run: |
          BLENDER_EXE="${{ github.workspace }}/blender_install/${{ matrix.blender_exe_relative }}"
          chmod +x "$BLENDER_EXE" || true
          echo "path=$BLENDER_EXE" >> "$GITHUB_OUTPUT"
          "$BLENDER_EXE" --version

      - name: Upgrade Blender bundled CRT (Windows only)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $blenderCrt = "${{ github.workspace }}/blender_install/blender-4.2.0-windows-x64/blender.crt"
          if (-not (Test-Path $blenderCrt)) { exit 0 }
          $bundled = [Version]((Get-Item "$blenderCrt/msvcp140.dll").VersionInfo.ProductVersion)
          $system = [Version]((Get-Item "C:/Windows/System32/msvcp140.dll").VersionInfo.ProductVersion)
          if ($bundled -ge $system) { Write-Host "no upgrade needed ($bundled >= $system)"; exit 0 }
          Write-Host "upgrading CRT $bundled -> $system (onnxruntime 1.23.2 needs newer MSVC ABI)"
          foreach ($name in 'msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll','msvcp140_atomic_wait.dll','msvcp140_codecvt_ids.dll','vcruntime140.dll','vcruntime140_1.dll','concrt140.dll') {
            $src = "C:/Windows/System32/$name"
            if (Test-Path $src) { Copy-Item -Force $src "$blenderCrt/$name" }
          }

      - name: Cache ONNX Runtime ${{ matrix.blender_target }}
        id: cache-ort
        uses: actions/cache@v4
        with:
          path: ThylloreAnimation/vendor/onnxruntime
          key: ort-${{ matrix.blender_target }}-1.23.2

      - name: Download and extract ONNX Runtime (cache miss)
        if: steps.cache-ort.outputs.cache-hit != 'true'
        working-directory: ThylloreAnimation
        run: |
          mkdir -p vendor/onnxruntime
          cd vendor/onnxruntime
          curl -L -o ${{ matrix.ort_archive }} "${{ matrix.ort_url }}"
          ${{ matrix.ort_extract_cmd }}
          rm ${{ matrix.ort_archive }}

      - name: Cache curve_copilot ONNX from HuggingFace
        id: cache-onnx
        uses: actions/cache@v4
        with:
          path: ThylloreAnimation/fixtures/ml_parity/onnx/curve_copilot.onnx
          key: curve-copilot-onnx-${{ env.ONNX_REVISION }}

      - name: Download curve_copilot ONNX from HuggingFace (cache miss)
        if: steps.cache-onnx.outputs.cache-hit != 'true'
        working-directory: ThylloreAnimation
        run: |
          mkdir -p fixtures/ml_parity/onnx
          curl -fL --retry 3 --retry-delay 2 \
            -o fixtures/ml_parity/onnx/curve_copilot.onnx \
            "https://huggingface.co/${ONNX_REPO}/resolve/${ONNX_REVISION}/curve_copilot.onnx"

      # Phase 5.5 MVP removes the license module; the keypair generation step is
      # left as a no-op so the workflow stays readable when Phase 6 reintroduces
      # the Auth Backend public key wiring.
      # - name: Generate dev keypair (CI only — not committed)
      #   working-directory: ThylloreAnimation
      #   shell: pwsh
      #   run: |
      #     pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/gen_license_keypair.ps1

      - name: Collect vendored wheels (pip download + maturin) -- full Variant for Tier A
        working-directory: ThylloreAnimation
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/collect_wheels.ps1 `
              -Platforms ${{ matrix.wheel_platform }} -Variant full

      - name: Build Phase 4 extension ZIP (full Variant -- parity needs Tier A grpc_client/ and text_to_motion.py)
        id: build
        working-directory: ThylloreAnimation
        shell: pwsh
        run: |
          ./scripts/build_blender_addon.ps1 -Platform ${{ matrix.extension_platform }} -Variant full -SkipBlenderValidate
          Get-ChildItem dist/

      - name: Install extension into Blender user dir
        working-directory: ThylloreAnimation
        env:
          BLENDER_EXE: ${{ steps.blender-path.outputs.path }}
          ZIP: ${{ steps.build.outputs.zip_path }}
        run: |
          set -e
          if [[ -z "$ZIP" || ! -f "$ZIP" ]]; then
              echo "::error::build_blender_addon.ps1 did not emit zip_path output (sentinel missing)" >&2
              exit 1
          fi
          echo "Installing $ZIP"
          "$BLENDER_EXE" --command extension install-file --repo user_default --enable "$ZIP"

      - name: Generate parity fixtures (proto + numpy)
        working-directory: ThylloreAnimation
        env:
          THYLLORE_PARITY_FIXTURE_OUTPUT: ${{ github.workspace }}/ThylloreAnimation/fixtures/ml_parity
          ORT_DYLIB_PATH: ${{ github.workspace }}/ThylloreAnimation/${{ matrix.ort_dylib_relative }}
        run: |
          cargo test -p thyllore-grpc-client --features auto-rig,text-to-motion \
            --test grpc_fixture_generator generate_grpc_request_response_fixtures \
            -- --ignored --nocapture
          cargo test -p thyllore-ml-core \
            --test curve_copilot_fixture_generator generate_curve_copilot_input_and_golden_fixtures \
            -- --ignored --nocapture

      - name: Write fixture manifest + verify integrity
        working-directory: ThylloreAnimation
        env:
          THYLLORE_PARITY_FIXTURE_OUTPUT: ${{ github.workspace }}/ThylloreAnimation/fixtures/ml_parity
          ONNX_REVISION: 904b8b9e4cb7b2bf7c702100253c5868ba5eb2e1
        run: |
          cargo test -p thyllore-grpc-client \
            --test fixture_manifest_writer write_manifest_from_fixture_dir \
            -- --ignored --nocapture
          cargo test -p thyllore-grpc-client \
            --test fixture_hash_check fixture_root_matches_manifest \
            -- --ignored --nocapture

      - name: Run curve_copilot Blender parity (typed vs call_op_json)
        working-directory: ThylloreAnimation
        env:
          THYLLORE_PARITY_FIXTURE_OUTPUT: ${{ github.workspace }}/ThylloreAnimation/fixtures/ml_parity
          THYLLORE_BLENDER_PATH: ${{ steps.blender-path.outputs.path }}
          # Phase 5.5 MVP: license module removed (Phase 6 reintroduces).
          ORT_DYLIB_PATH: ${{ github.workspace }}/ThylloreAnimation/${{ matrix.ort_dylib_relative }}
        run: |
          cargo test -p thyllore-ml-core --test curve_copilot_blender_parity \
            curve_copilot_typed_and_call_op_paths_match_in_blender -- --ignored --nocapture

      - name: Run curve_copilot Operator headless smoke
        working-directory: ThylloreAnimation
        env:
          THYLLORE_PARITY_FIXTURE_OUTPUT: ${{ github.workspace }}/ThylloreAnimation/fixtures/ml_parity
          THYLLORE_BLENDER_PATH: ${{ steps.blender-path.outputs.path }}
          # Phase 5.5 MVP: license module removed (Phase 6 reintroduces).
          ORT_DYLIB_PATH: ${{ github.workspace }}/ThylloreAnimation/${{ matrix.ort_dylib_relative }}
        run: |
          cargo test -p thyllore-grpc-client \
            --test curve_copilot_operator_smoke curve_copilot_operator_runs_under_background \
            --features auto-rig,text-to-motion -- --ignored --nocapture

      - name: Run gRPC request wire-bytes + response parity
        working-directory: ThylloreAnimation
        env:
          THYLLORE_PARITY_FIXTURE_OUTPUT: ${{ github.workspace }}/ThylloreAnimation/fixtures/ml_parity
          THYLLORE_BLENDER_PATH: ${{ steps.blender-path.outputs.path }}
          # Phase 5.5 MVP: license module removed (Phase 6 reintroduces).
          ORT_DYLIB_PATH: ${{ github.workspace }}/ThylloreAnimation/${{ matrix.ort_dylib_relative }}
        run: |
          cargo test -p thyllore-grpc-client \
            --test grpc_request_wire_parity grpc_request_wire_bytes_match_across_rust_and_blender \
            --features auto-rig,text-to-motion -- --ignored --nocapture

      - name: Upload diagnostic artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blender-parity-diag-${{ matrix.os }}
          path: |
            ThylloreAnimation/target/debug/deps/*.log
            ThylloreAnimation/dist/
          retention-days: 7
