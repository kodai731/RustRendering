name = "curve-copilot-feedback"
main = "src/index.mjs"
compatibility_date = "2026-07-01"

[[r2_buckets]]
binding = "FEEDBACK_BUCKET"
bucket_name = "curve-feedback"

[[durable_objects.bindings]]
name = "LICENSE_SEATS"
class_name = "LicenseSeats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LicenseSeats"]

[vars]
TOKEN_TTL_SECONDS = "604800"
MAX_BODY_BYTES = "1048576"
MAX_MESSAGE_TEXT_BYTES = "4096"
SEAT_TTL_SECONDS = "2592000"

# This file is the config source of truth. Deploy with ./deploy.sh (curl only,
# no npm / wrangler); it parses the values above and uploads the worker plus the
# secrets below as secret_text bindings via the Cloudflare REST API.
#
# Secrets (supplied to deploy.sh via the environment, never committed):
#   INGEST_TOKEN                  <- THYLLORE_INGEST_TOKEN
#   ADMIN_TOKEN                   <- THYLLORE_ADMIN_TOKEN
#                                    (guards /v1/license/provision)
#   UNLOCK_PRIVATE_KEY_PKCS8_B64  <- THYLLORE_UNLOCK_PRIVATE_KEY_PKCS8_B64[_FILE]
#                                    (Ed25519 PKCS8 DER base64 from
#                                     scripts/gen_license_keypair.sh)
