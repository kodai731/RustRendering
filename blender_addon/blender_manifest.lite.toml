schema_version = "1.0.0"

# MVP variant -- distinct id so users can install both the lite (offline,
# unauthenticated, $30-$40 buyout) and full (Phase 6 SaaS, subscription) ZIPs
# side by side without conflicts.
id = "thyllore_animation_lite"
version = "0.0.1"
name = "Thyllore Animation Curve Copilot"
tagline = "Offline FCurve copilot for Blender"
maintainer = "kodai731 <kodai731@gmail.com>"

type = "add-on"

blender_version_min = "4.2.0"

license = ["SPDX:GPL-2.0-or-later"]

# Tier B-only wheel set. Tier A (grpcio / grpcio-status / protobuf / certifi)
# is intentionally excluded -- the lite Variant does not bundle the gRPC
# client and ships ~30 MB lighter than the full Variant.
wheels = [
    "./wheels/thyllore_ml_core-0.0.1-cp310-abi3-PLATFORM.whl",
]

platforms = ["PLATFORM_BLENDER_NAME"]

# The network line below is a placeholder substituted per build mode by
# build_blender_addon.sh/.ps1; mode A ships no network code, so the line
# is removed entirely.
[permissions]
files = "Read bundled ONNX model and write FCurve / Action keyframes"
network = "NETWORK_PERMISSION"

[build]
paths_exclude_pattern = [
    "tests/",
    "**/__pycache__/",
    "**/*.pyc",
    ".pytest_cache/",
    "*.egg-info/",
]
