# Parameters bundled into the Thyllore Flame extension UI.
# Every other flame parameter stays at its preset value.
# Names follow crates/thyllore-effect-core flame UI params (flame_ui_params()).

[exposed]
names = ["height", "radius", "intensity", "optical_depth", "use_blackbody"]
prefixes = ["noise_", "color_", "temperature_"]

# Values applied once when a flame is added (after the campfire preset).
[initial]
optical_depth = 1.0
