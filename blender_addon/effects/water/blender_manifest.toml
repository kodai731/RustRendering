schema_version = "1.0.0"

id = "thyllore_water"
version = "0.0.1"
name = "Thyllore Water"
tagline = "Closed-form water torus from the Thyllore engine"
maintainer = "kodai731 <kodai731@gmail.com>"

type = "add-on"

blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]

# The "PLATFORM" placeholders are substituted by
# scripts/blender/water/build_addon.sh when producing per-platform ZIPs.
# The parameters exposed in the UI are listed in water_params.toml.
wheels = [
    "./wheels/thyllore_effect_core-0.0.1-cp310-abi3-PLATFORM.whl",
]

platforms = ["PLATFORM_BLENDER_NAME"]

[permissions]
files = "Write water EXR sequence"

[build]
paths_exclude_pattern = [
    "tests/",
    "**/__pycache__/",
    "**/*.pyc",
    ".pytest_cache/",
    "*.egg-info/",
    "tools/",
    "debug/",
]
