[package]
name = "thyllore-importer-core"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
authors = ["kodai731"]
description = "Layer 3 model importer for ThylloreAnimation (glTF / FBX / PNG loaders). Returns pure model-core + anim-core types; no ECS or Vulkan dependency"
repository = "https://github.com/kodai731/Thyllore-Animation"

[dependencies]
thyllore-math-core = { path = "../thyllore-math-core" }
thyllore-model-core = { path = "../thyllore-model-core" }
thyllore-anim-core = { path = "../thyllore-anim-core" }
thyllore-log-core = { path = "../thyllore-log-core" }
anyhow = "1"
cgmath = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
ufbx = "0.10"
gltf = { version = "1.4", features = ["extras", "names", "extensions"] }

[features]
auto-rig = []
