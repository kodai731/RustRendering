[package]
name = "thyllore-grpc-client"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
authors = ["kodai731"]
description = "Layer 5 gRPC client for ThylloreAnimation — proto-generated stubs and request/response converters for ML server. No ECS or Vulkan dependency"
repository = "https://github.com/kodai731/Thyllore-Animation"
build = "build.rs"

[dependencies]
thyllore-model-core = { path = "../thyllore-model-core" }
thyllore-anim-core = { path = "../thyllore-anim-core" }
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[build-dependencies]
tonic-build = { version = "0.12", optional = true }
protox = { version = "0.7", optional = true }

[features]
default = []
text-to-motion = ["dep:tonic", "dep:prost", "dep:tokio", "dep:tonic-build", "dep:protox"]
auto-rig = ["text-to-motion"]

[dev-dependencies]
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
tonic = "0.12"
tokio = { version = "1", features = ["rt", "sync", "macros", "net", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
