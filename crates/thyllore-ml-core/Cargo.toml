[package]
name = "thyllore-ml-core"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
authors = ["kodai731"]
description = "Layer 2 ML inference core for ThylloreAnimation. References only thyllore-model-core, never thyllore-anim-core. Optionally exposes a PyO3 facade for Blender addon when built with the `python` feature"
repository = "https://github.com/kodai731/Thyllore-Animation"

[lib]
name = "thyllore_ml_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3", "dep:numpy", "dep:pythonize"]

[dependencies]
thyllore-ml-api = { path = "../thyllore-ml-api" }
thyllore-model-core = { path = "../thyllore-model-core" }
ort = { version = "2.0.0-rc.11", default-features = false, features = ["std", "ndarray", "load-dynamic", "download-binaries", "copy-dylibs", "tls-native"] }
anyhow = "1"
cgmath = "0.18"
serde_json = "1"

pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"], optional = true }
numpy = { version = "0.23", optional = true }
pythonize = { version = "0.23", optional = true }

[dev-dependencies]
tempfile = "3"

